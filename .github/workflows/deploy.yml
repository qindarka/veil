# Auto-deploy on push to main:
#   1. typecheck + build the Vite client
#   2. deploy the Worker + Durable Object (wrangler deploy)
#   3. deploy the static client to Cloudflare Pages
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with "Workers Scripts: Edit" + "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
# Required repository variable:
#   VITE_WORKER_URL        - public URL of the deployed worker, e.g.
#                            https://echoes-of-the-veil.<subdomain>.workers.dev
# See docs/DEPLOYMENT.md for one-time setup (creating the Pages project etc.).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build client
        run: npm run build
        env:
          # Baked into the client at build time; must point at the deployed worker.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - name: Deploy Worker + Durable Object
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep CI deploys on the same wrangler version package.json pins.
          wranglerVersion: '4.99.0'
          command: deploy

      - name: Deploy client to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.99.0'
          command: pages deploy dist --project-name=echoes-of-the-veil
