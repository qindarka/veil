# Cloudflare Workers configuration for Echoes of the Veil — one Worker serves
# everything: the built client from dist/ as static assets, and /api/* for
# realtime, where each campaign ("room") is one Durable Object instance
# addressed by its room code (live WebSocket sessions + persisted state).
#
# Deploys via the dashboard's Git integration: connect this repo under
# Workers & Pages, set the build command to "npm run build", and every push
# builds and deploys automatically (see docs/DEPLOYMENT.md).

name = "echoes-of-the-veil"
main = "worker/src/index.ts"
compatibility_date = "2026-05-01"

# Serve the Vite build output as static assets on the same origin as the API,
# so the client needs no configured backend URL (it connects same-origin).
[assets]
directory = "dist"
not_found_handling = "single-page-application"
# Assets win by default; force API (and its WebSocket upgrades) to the Worker.
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "VeilRoom"

# SQLite-backed Durable Objects (required for free plan, recommended generally).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VeilRoom"]

[dev]
port = 8787

[vars]
# Origin allowed for cross-origin HTTP API calls ("*" = any origin).
# Tighten this to your Pages URL in production if desired.
ALLOWED_ORIGIN = "*"
